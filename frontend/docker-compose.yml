version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsa-tracker-frontend:latest
    container_name: dsa-tracker-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - dsa-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Uncomment to include backend:
  # backend:
  #   image: dsa-tracker-backend:latest
  #   container_name: dsa-tracker-backend
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DATABASE_URL=postgresql://user:pass@db:5432/dsa
  #   networks:
  #     - dsa-network

networks:
  dsa-network:
    name: dsa-network
    driver: bridge
